services:
  ttoken-green:
    extends:
      file: docker-compose.yml
      service: sub2api
    image: ghcr.io/txzh007/ttoken:0.2.0
    platform: linux/amd64
    container_name: ttoken-green
    ports: !override
      - "${TTOKEN_BIND_HOST:-127.0.0.1}:${TTOKEN_HOST_PORT:-18080}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required for stable secret decryption}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
